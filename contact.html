<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angkringan 823 - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="brand-text">Angkringan</span>
                <img src="assets/logo/logo.webp" alt="Logo" class="logo-img">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="service.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-header-section">
                <h2 class="contact-main-title">-- Hubungi --</h2>
                <h3 class="contact-main-subtitle">-- Angkringan 823 --</h3>
            </div>

            <div class="row align-items-start mt-5">
                <!-- Left Side - Store & Contact Info -->
                <div class="col-lg-6">
                    <div class="store-section fade-in">
                        <img src="assets/home/beranda/3.webp" alt="Angkringan 823 Store" class="contact-store-image">
                    </div>

                    <div class="contact-info-wrapper">
                        <h4 class="contact-info-header">Informasi Kontak :</h4>
                        
                        <a href="mailto:agkngrn823@gmeel.fom" class="contact-info-item">
                            <span class="material-symbols-outlined contact-icon-symbol">mail</span>
                            <span class="contact-info-text">agkngrn823@gmeel.fom</span>
                        </a>

                        <a href="tel:+010101010100" class="contact-info-item">
                            <span class="material-symbols-outlined contact-icon-symbol">call</span>
                            <span class="contact-info-text">+01 0101010100</span>
                        </a>

                        <a href="https://maps.google.com/?q=Jl. Pochirki Desa Erangel" target="_blank" class="contact-info-item">
                            <span class="material-symbols-outlined contact-icon-symbol">location_on</span>
                            <span class="contact-info-text">Jl. Pochinki Desa Erangel</span>
                        </a>
                    </div>
                </div>

                <!-- Right Side - Contact Form -->
                <div class="col-lg-6">
                    <div class="contact-form-panel slide-in-right">
                        <h4 class="form-panel-title">-- Tinggalkan Pesan --</h4>
                        <div class="form-wrapper">
                            <div class="form-group-custom">
                                <label class="form-label-custom">Nama :</label>
                                <input type="text" class="form-input-custom" id="contactName" placeholder="">
                            </div>
                            <div class="form-group-custom">
                                <label class="form-label-custom">Email :</label>
                                <input type="email" class="form-input-custom" id="contactEmail" placeholder="">
                            </div>
                            <div class="form-group-custom">
                                <label class="form-label-custom">Pesan :</label>
                                <textarea class="form-textarea-custom" id="contactMessage" rows="5" placeholder=""></textarea>
                            </div>
                            <button type="button" class="btn-submit-custom" onclick="submitContactForm()">
                                <span class="material-symbols-outlined btn-icon">send</span>
                                Kirim Pesan
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/010101010100" target="_blank" class="whatsapp-float" title="Chat WhatsApp">
        <span class="material-symbols-outlined">chat</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
