<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angkringan 823 - Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="service-page">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="brand-text">Angkringan</span>
                <img src="assets/logo/logo.webp" alt="Logo" class="logo-img">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="service.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Product Section -->
    <section class="product-section">
        <div class="product-container">
            <!-- Left Panel - Menu -->
            <div class="menu-left-panel">
                <div class="menu-content-wrapper">
                    <h2 class="menu-main-title">Menu Angkringan 823</h2>
                    
                    <!-- Makanan -->
                    <div class="menu-category">
                        <h3 class="category-header"># Makanan #</h3>
                        <div class="menu-grid">
                            <div class="menu-card" data-menu="naci" onclick="changeMenuImage('naci')">
                                <img src="assets/produk/makanan/1.webp" alt="Naci" class="menu-img">
                                <p class="menu-label">Naci</p>
                            </div>
                            <div class="menu-card" data-menu="holengan" onclick="changeMenuImage('holengan')">
                                <img src="assets/produk/makanan/2.webp" alt="Holengan" class="menu-img">
                                <p class="menu-label">Holengan</p>
                            </div>
                            <div class="menu-card" data-menu="mwie" onclick="changeMenuImage('mwie')">
                                <img src="assets/produk/makanan/3.webp" alt="Mwie" class="menu-img">
                                <p class="menu-label">Mwie</p>
                            </div>
                        </div>
                    </div>

                    <!-- Minuman -->
                    <div class="menu-category">
                        <h3 class="category-header"># Minuman #</h3>
                        <div class="menu-grid">
                            <div class="menu-card" data-menu="copiee" onclick="changeMenuImage('copiee')">
                                <img src="assets/produk/minuman/1.webp" alt="Copiee" class="menu-img">
                                <p class="menu-label">Copiee</p>
                            </div>
                            <div class="menu-card" data-menu="ess_gell" onclick="changeMenuImage('ess_gell')">
                                <img src="assets/produk/minuman/2.webp" alt="Ess gell" class="menu-img">
                                <p class="menu-label">Ess gell</p>
                            </div>
                            <div class="menu-card" data-menu="copicop" onclick="changeMenuImage('copicop')">
                                <img src="assets/produk/minuman/3.webp" alt="Copicop" class="menu-img">
                                <p class="menu-label">Copicop</p>
                            </div>
                        </div>
                    </div>

                    <!-- Bakaran -->
                    <div class="menu-category">
                        <h3 class="category-header"># Bakaran #</h3>
                        <div class="menu-grid">
                            <div class="menu-card" data-menu="cate_catean" onclick="changeMenuImage('cate_catean')">
                                <img src="assets/produk/bakaran/1.webp" alt="Cate-catean" class="menu-img">
                                <p class="menu-label">Cate-catean</p>
                            </div>
                            <div class="menu-card" data-menu="bakalan_ayam" onclick="changeMenuImage('bakalan_ayam')">
                                <img src="assets/produk/bakaran/2.webp" alt="Bakalan ayam" class="menu-img">
                                <p class="menu-label">Bakalan ayam</p>
                            </div>
                            <div class="menu-card" data-menu="ceapudd" onclick="changeMenuImage('ceapudd')">
                                <img src="assets/produk/bakaran/3.webp" alt="Ceapudd" class="menu-img">
                                <p class="menu-label">Ceapudd</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel - Image Display FULL -->
            <div class="menu-right-panel">
                <img id="menuDisplayImage" src="assets/produk/display/display.webp" alt="Menu Display" class="menu-display-image">
            </div>
        </div>
    </section>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/010101010100" target="_blank" class="whatsapp-float" title="Chat WhatsApp">
        <span class="material-symbols-outlined">chat</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
