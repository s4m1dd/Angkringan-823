<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angkringan 823 - Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="gallery-page">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <span class="brand-text">Angkringan</span>
                <img src="assets/logo/logo.webp" alt="Logo" class="logo-img">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="service.html">Product</a></li>
                    <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Gallery Section -->
    <section class="gallery-section">
        <div class="container py-5">
            <div class="chalkboard-panel">
                <div class="chalkboard-inner">
                    <div class="gallery-header">
                        <h2 class="gallery-title">-- Galeri --</h2>
                        <h3 class="gallery-subtitle">-- Angkringan 823 --</h3>
                    </div>

                    <div class="row g-4 mb-5">
                        <div class="col-md-4">
                            <div class="gallery-polaroid zoom-in" onclick="openImageModal(this)">
                                <img src="assets/galeri/ulang-tahun-angkringan-823.webp" alt="Ulang Tahun" class="polaroid-img">
                                <p class="polaroid-text">#Ulang Tahun Angkringan 823</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="gallery-polaroid zoom-in" style="animation-delay: 0.1s;" onclick="openImageModal(this)">
                                <img src="assets/galeri/tahun-baru-2026.webp" alt="Tahun Baru 2026" class="polaroid-img">
                                <p class="polaroid-text">#Tahun Baru 2026</p>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="gallery-polaroid zoom-in" style="animation-delay: 0.2s;" onclick="openImageModal(this)">
                                <img src="assets/galeri/camping.webp" alt="Camping" class="polaroid-img">
                                <p class="polaroid-text">#Camping</p>
                            </div>
                        </div>
                    </div>

                    <div class="gallery-footer">
                        <h3 class="family-title">#Angkringan 823 Family</h3>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Image Modal -->
    <div class="image-modal" id="imageModal" onclick="closeImageModal()">
        <span class="close-modal">&times;</span>
        <img class="modal-content-img" id="modalImage">
        <div class="modal-caption" id="modalCaption"></div>
    </div>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/010101010100" target="_blank" class="whatsapp-float" title="Chat WhatsApp">
        <span class="material-symbols-outlined">chat</span>
    </a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
